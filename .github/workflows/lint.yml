name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-compile:
    name: python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile check
        run: |
          python -m py_compile plugin/bridge.py plugin/__init__.py
          python -m py_compile installer/install.py
          python -m py_compile scripts/post_call_summary.py
      - name: install yaml lint dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2
      - name: yaml lint
        run: python -c "import yaml; yaml.safe_load(open('plugin/plugin.yaml').read())"
