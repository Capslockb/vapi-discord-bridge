name: public-docs-safety

on:
  pull_request: {}
  push:
    branches: [ main, master, release/** ]

jobs:
  public-docs-safety:
    name: public-docs-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: public-docs-safety
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/public_community_docs_safety.py
          python3 scripts/public_template_docs_safety.py
      - name: adversarial fixture test
        run: python3 -m unittest discover -s tests -p 'test_public*_safety.py' -v
